name: Canary - Playwright vs Vercel challenge

on:
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Dry-run news scraper
        run: python tools/scraper/scrape_news.py --dry-run

      - name: Dry-run calendar scraper
        run: python tools/scraper/scrape_calendar.py --dry-run
