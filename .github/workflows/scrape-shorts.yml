# Mirrors btcc.net's homepage "Latest BTCC Shorts" carousel into
# data/shorts.json. First workflow to fetch btcc.net's bare root URL - every
# other btcc.net-facing workflow targets a specific subpath. Weekly cadence
# matches how infrequently this widget's content actually turns over (same
# reasoning as scrape-calendar.yml/scrape-gallery.yml's own weekly slots),
# scheduled off the :00/:30 marks per the documented "overnight cron gap"
# fix (root README.md) - GitHub's own scheduler is most contended right on
# the hour/half-hour.
name: Scrape BTCC Shorts

on:
  schedule:
    - cron: "33 9 * * 3"   # Wednesday 09:33 UTC
  workflow_dispatch:
    inputs:
      is_retry:
        description: "internal - marks this run as an automated retry (do not set manually)"
        type: boolean
        default: false

concurrency:
  group: scrape-shorts
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No pip install needed - scrapfly_fallback.py is pure stdlib, and this
      # scraper stores YouTube's own CDN thumbnail URLs directly rather than
      # mirroring image bytes, so there's no Pillow/cwebp dependency either.
      - name: Scrape BTCC Shorts
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
        working-directory: tools/scraper
        run: python3 scrape_shorts.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update BTCC Shorts from btcc.net [skip ci]"
          file_pattern: "data/shorts.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: "--force-with-lease"

      # Covers a genuine script failure() as well as cancelled(). This only
      # runs weekly, so a failure here would otherwise wait a full week for
      # its next natural attempt. is_retry guards against looping: a run
      # dispatched BY this step carries is_retry=true, so a second failure
      # falls through to "Report failure" instead of dispatching again.
      - name: Retry once on failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scrape-shorts.yml/dispatches" \
            -d '{"ref":"main","inputs":{"is_retry":"true"}}' || echo "Retry dispatch failed (non-fatal)"

      # Only reached once the automated retry above has ALSO failed/been
      # cancelled - a single transient blip no longer emails anyone.
      - name: Report failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry == 'true'
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "x-scraper-secret: ${SCRAPER_SECRET}" \
            -d "{\"workflow\":\"scrape-shorts\",\"message\":\"BTCC Shorts scrape failed (auto-retry also failed)\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://us-central1-btcchub-af77a.cloudfunctions.net/reportScraperFailure" || echo "Failure report failed (non-fatal)"
