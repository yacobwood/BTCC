name: Session Watcher

# Connects to TSL SignalR live timing and on sessioncomplete: scrapes results,
# commits and sends the session's results notification.
#
# Started automatically by functions/watcherDispatch.js (Cloud Scheduler):
# one run per BTCC session, dispatched at that session's start time with the
# `session` input set. Can still be run manually for a whole day (leave
# `session` blank) as a fallback - don't do both for the same day, or every
# result push goes out twice.

on:
  workflow_dispatch:
    inputs:
      round:
        description: "Round number (1–10)"
        required: true
        type: number
      day:
        description: "Race day"
        required: true
        type: choice
        options: [saturday, sunday]
      year:
        description: "Season year"
        required: false
        default: "2026"
      session:
        description: "Only watch this session, e.g. Race 1 (blank = whole day, manual fallback only)"
        required: false
        default: ""

concurrency:
  group: session-watcher-${{ inputs.round }}-${{ inputs.day }}-${{ inputs.session }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360      # GitHub's hosted-runner max. A per-session run needs well under 1h; a whole-day manual run can NOT cover Sunday (Race 1 start to Race 3 result is ~6.5h)
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pdfminer.six websocket-client google-auth requests

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

      - name: Run session watcher
        run: |
          python .github/scripts/session_watcher.py \
            --round ${{ inputs.round }} \
            --day   ${{ inputs.day }}   \
            --year  ${{ inputs.year || '2026' }} \
            ${SESSION:+--session "$SESSION"}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SESSION: ${{ inputs.session }}
