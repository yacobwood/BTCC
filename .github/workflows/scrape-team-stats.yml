# Team race/win totals (drivers.json totalRaces/totalWins) used to be
# scraped as a post-step of every scrape-results.yml run, but that meant
# launching a headless browser on every 2-minute results tick during a
# live race weekend. Split out into its own weekly job instead - team
# totals only change once a race weekend's results are final anyway, and
# btcc.net's own dev confirmed results/standings only move on race
# weekends, so a Monday check reliably catches anything new.
#
# Runs on a self-hosted runner (see scrape-news.yml comment /
# project_vercel_migration memory) since btcc.net's Vercel bot-challenge
# blocks GitHub-hosted runner IPs even with headless Chromium - interim
# fix until btcc.net's dev allowlists us.
name: Scrape BTCC Team Stats

on:
  schedule:
    # Weekly, Monday 06:30 UTC - same window as scrape-btcc-stats.yml.
    - cron: "30 6 * * 1"
  workflow_dispatch:

concurrency:
  group: scrape-team-stats
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: [self-hosted, btcc-mac]
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Run team stats scraper
        run: ~/.btcc-scraper-venv/bin/python tools/scraper/scrape_team_stats.py

      # Committed immediately, before the second scraper runs - previously
      # both scripts ran as two steps sharing one commit at the very end, so
      # a driver-backgrounds failure (a bare traceback before the 2026-08-17
      # fix; now a clean sys.exit(1) - either way, no continue-on-error is
      # set) skipped every step after it, including this commit, and threw
      # away scrape_team_stats.py's already-successful update along with it.
      # Mirrors scrape-news.yml's own early-commit pattern for the same
      # reason (see its "Commit news update" step comment).
      - name: Commit team stats update
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update team stats from btcc.net [skip ci]"
          file_pattern: "data/drivers.json data/media/teams/"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: "--force-with-lease"

      - name: Run driver background scraper
        run: ~/.btcc-scraper-venv/bin/python tools/scraper/scrape_driver_backgrounds.py

      # Re-sync first, same reason/pattern as scrape-news.yml's "Pull latest
      # before article commit" step - other workflows push to main constantly.
      - name: Pull latest before driver background commit
        run: git pull --rebase --autostash origin main

      - name: Commit driver background update
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update driver backgrounds from btcc.net [skip ci]"
          file_pattern: "data/drivers.json data/media/drivers/"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: "--force-with-lease"

      - name: Report failure
        if: failure()
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "x-scraper-secret: ${SCRAPER_SECRET}" \
            -d "{\"workflow\":\"scrape-team-stats\",\"message\":\"Team stats scrape failed\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://us-central1-btcchub-af77a.cloudfunctions.net/reportScraperFailure" || echo "Failure report failed (non-fatal)"
