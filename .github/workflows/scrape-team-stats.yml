# Team race/win totals (drivers.json totalRaces/totalWins) used to be
# scraped as a post-step of every scrape-results.yml run, but that meant
# launching a headless browser on every 2-minute results tick during a
# live race weekend. Split out into its own weekly job instead - team
# totals only change once a race weekend's results are final anyway, and
# btcc.net's own dev confirmed results/standings only move on race
# weekends, so a Monday check reliably catches anything new.
#
# Used to also run scrape_driver_backgrounds.py as a second step here (it
# shared this job's weekly cadence) - archived 2026-08-18 along with
# driver/team card-background and car-image live scraping generally, in
# favour of a hand-curated image set (see tools/scraper/archive/README.md).
# Only the team stats scrape remains.
#
# Fetches via Scrapfly (see scrape-news.yml's own comment /
# project_scrapfly_full_migration memory) as of 2026-09-01 rather than a
# self-hosted runner's local Playwright - runs on GitHub-hosted
# ubuntu-latest, no residential IP needed.
name: Scrape BTCC Team Stats

on:
  schedule:
    # Weekly, Monday 06:30 UTC - same window as scrape-btcc-stats.yml.
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      is_retry:
        description: "internal - marks this run as an automated retry (do not set manually)"
        type: boolean
        default: false

concurrency:
  group: scrape-team-stats
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Run team stats scraper
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
        working-directory: tools/scraper
        run: python3 scrape_team_stats.py

      - name: Commit team stats update
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update team stats from btcc.net [skip ci]"
          file_pattern: "data/drivers.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: "--force-with-lease"

      # Covers a genuine script failure() as well as cancelled(). This only
      # runs weekly, so unlike scrape-news.yml (which gets a free retry
      # from cron every 5 minutes anyway) a failure here would otherwise
      # wait a full week for its next natural attempt. is_retry guards
      # against looping: a run dispatched BY this step carries
      # is_retry=true, so a second failure falls through to "Report
      # failure" instead of dispatching again.
      - name: Retry once on failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scrape-team-stats.yml/dispatches" \
            -d '{"ref":"main","inputs":{"is_retry":"true"}}' || echo "Retry dispatch failed (non-fatal)"

      # Only reached once the automated retry above has ALSO failed/been
      # cancelled - a single transient blip no longer emails anyone.
      - name: Report failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry == 'true'
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "x-scraper-secret: ${SCRAPER_SECRET}" \
            -d "{\"workflow\":\"scrape-team-stats\",\"message\":\"Team stats scrape failed (auto-retry also failed)\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://us-central1-btcchub-af77a.cloudfunctions.net/reportScraperFailure" || echo "Failure report failed (non-fatal)"
