# On-demand only, unlike scrape-results/calendar/btcc-stats/youtube - there's
# no sensible schedule for "a specific driver's photo changed on btcc.net",
# only a human noticing it and triggering this from the admin panel's DRIVER
# MEDIA card (or `gh workflow run` directly). Fetches via Scrapfly (see
# scrapfly_fallback.py / tools/scraper/README.md's access model section),
# same as every other btcc.net-facing scraper since the 2026-09-01 migration -
# runs on GitHub-hosted ubuntu-latest, no residential IP needed.
name: Scrape Driver Media

on:
  workflow_dispatch:
    inputs:
      driver_name:
        description: "Exact name as it appears in drivers.json (e.g. Daniel Lloyd)"
        type: string
        required: true
      driver_slug:
        description: "btcc.net URL slug (e.g. daniel-lloyd - check the driver's page URL)"
        type: string
        required: true
      is_retry:
        description: "internal - marks this run as an automated retry (do not set manually)"
        type: boolean
        default: false

concurrency:
  group: scrape-driver-media
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install Pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Scrape driver media
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
        working-directory: tools/scraper
        run: |
          python3 scrape_driver_media.py \
            --driver-name "${{ github.event.inputs.driver_name }}" \
            --driver-slug "${{ github.event.inputs.driver_slug }}"

      - name: Commit updated media
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update driver photo/car image from btcc.net [skip ci]"
          file_pattern: "data/driverImages/ data/carImages/ data/drivers.json src/assets/driver_images/ src/assets/driver_images_large/"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: "--force-with-lease"

      # Covers a genuine script failure() as well as cancelled(). Carries the
      # same driver_name/driver_slug through so a retry targets the same
      # driver. is_retry guards against looping: a run dispatched BY this step
      # carries is_retry=true, so a second failure falls through to "Report
      # failure" instead of dispatching again.
      - name: Retry once on failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scrape-driver-media.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"is_retry\":\"true\",\"driver_name\":\"${{ github.event.inputs.driver_name }}\",\"driver_slug\":\"${{ github.event.inputs.driver_slug }}\"}}" || echo "Retry dispatch failed (non-fatal)"

      # Only reached once the automated retry above has ALSO failed/been
      # cancelled - a single transient blip no longer emails anyone.
      - name: Report failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry == 'true'
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "x-scraper-secret: ${SCRAPER_SECRET}" \
            -d "{\"workflow\":\"scrape-driver-media\",\"message\":\"Driver media scrape failed for ${{ github.event.inputs.driver_name }} (auto-retry also failed)\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://us-central1-btcchub-af77a.cloudfunctions.net/reportScraperFailure" || echo "Failure report failed (non-fatal)"
