# Fetches via Scrapfly (see scrape-news.yml's own comment /
# project_scrapfly_full_migration memory) as of 2026-09-01 rather than a
# self-hosted runner's local Playwright - runs on GitHub-hosted
# ubuntu-latest, no residential IP needed.
#
# Weekly, not daily: all-time wins/titles only meaningfully change right
# after a race weekend (roughly biweekly), and btcc.net's own dev confirmed
# results/standings only move on race weekends - a Monday check reliably
# catches anything from the weekend just gone.
name: Scrape BTCC Official Stats

on:
  schedule:
    # Weekly, Monday 06:00 UTC — well outside race windows to avoid commit conflicts
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print changes without writing)"
        type: boolean
        default: false
      is_retry:
        description: "internal - marks this run as an automated retry (do not set manually)"
        type: boolean
        default: false

concurrency:
  group: scrape-btcc-stats
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Run scraper
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
        working-directory: tools/scraper
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python3 scrape_btcc_stats.py $ARGS

      - name: Commit updated records
        if: github.event.inputs.dry_run != 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update all-time records from btcc.net [skip ci]"
          file_pattern: "data/records.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: "--force-with-lease"

      # Covers a genuine script failure() as well as cancelled(). This only
      # runs weekly, so a failure here would otherwise wait a full week for
      # its next natural attempt. Carries dry_run through so a manual
      # dry-run retry doesn't accidentally write. is_retry guards against
      # looping: a run dispatched BY this step carries is_retry=true, so a
      # second failure falls through to "Report failure" instead of
      # dispatching again.
      - name: Retry once on failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scrape-btcc-stats.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"is_retry\":\"true\",\"dry_run\":\"${{ github.event.inputs.dry_run || 'false' }}\"}}" || echo "Retry dispatch failed (non-fatal)"

      # Only reached once the automated retry above has ALSO failed/been
      # cancelled - a single transient blip no longer emails anyone.
      - name: Report failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry == 'true'
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "x-scraper-secret: ${SCRAPER_SECRET}" \
            -d "{\"workflow\":\"scrape-btcc-stats\",\"message\":\"Official stats scrape failed (auto-retry also failed)\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://us-central1-btcchub-af77a.cloudfunctions.net/reportScraperFailure" || echo "Failure report failed (non-fatal)"
