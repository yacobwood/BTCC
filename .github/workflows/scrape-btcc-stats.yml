# Runs on a self-hosted runner (see scrape-news.yml comment /
# project_vercel_migration memory) since btcc.net's Vercel bot-challenge
# blocks GitHub-hosted runner IPs even with headless Chromium - interim
# fix until btcc.net's dev allowlists us.
#
# Weekly, not daily: all-time wins/titles only meaningfully change right
# after a race weekend (roughly biweekly), and btcc.net's own dev confirmed
# results/standings only move on race weekends - a Monday check reliably
# catches anything from the weekend just gone.
name: Scrape BTCC Official Stats

on:
  schedule:
    # Weekly, Monday 06:00 UTC — well outside race windows to avoid commit conflicts
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print changes without writing)"
        type: boolean
        default: false

concurrency:
  group: scrape-btcc-stats
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: [self-hosted, btcc-mac]
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Run scraper
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          ~/.btcc-scraper-venv/bin/python tools/scraper/scrape_btcc_stats.py $ARGS

      - name: Commit updated records
        if: github.event.inputs.dry_run != 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update all-time records from btcc.net [skip ci]"
          file_pattern: "data/records.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: "--force-with-lease"

      - name: Report failure
        if: failure()
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "x-scraper-secret: ${SCRAPER_SECRET}" \
            -d "{\"workflow\":\"scrape-btcc-stats\",\"message\":\"Official stats scrape failed\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://us-central1-btcchub-af77a.cloudfunctions.net/reportScraperFailure" || echo "Failure report failed (non-fatal)"
