# On-demand only, triggered from the admin panel's CIRCUIT IMAGES card (or
# `gh workflow run` directly) - no schedule, circuit hero photos change about
# as rarely as a driver signing, no sensible cadence to poll on. Migrated
# 2026-09-09 from tools/scraper/archive-era btcc_playwright.RenderedFetcher
# (self-hosted-runner only) to Scrapfly (see scrapfly_fallback.py /
# tools/scraper/README.md's access model section) so this could finally run
# on GitHub-hosted ubuntu-latest like every other scraper, instead of
# reintroducing a self-hosted-runner dependency for a brand-new 2026-09
# workflow.
name: Scrape Circuit Images

on:
  workflow_dispatch:
    inputs:
      is_retry:
        description: "internal - marks this run as an automated retry (do not set manually)"
        type: boolean
        default: false

concurrency:
  group: scrape-circuit-images
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Pillow only - media_utils.py's save_mirrored_image needs it for
      # resizing, no cwebp/bundle step here (unlike driver photos, there's
      # no bundled src/assets/ counterpart for track images - imageUrl is
      # always a live network fetch, see TrackDetailScreen.js).
      - name: Install dependencies
        run: pip install --quiet Pillow

      # continue-on-error: true - same reasoning as every other scraper this
      # session touched: one track's hero image genuinely failing to fetch
      # must not block the others that DID succeed from being committed, but
      # the run still needs to show red overall so the retry-once mechanism
      # fires (see "Fail job if scrape step failed" below).
      - name: Scrape circuit images
        id: scrape
        continue-on-error: true
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
        working-directory: tools/scraper
        run: python3 scrape_circuit_images.py

      - name: Commit updated media
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update circuit hero images from btcc.net [skip ci]"
          file_pattern: "data/tracks.json data/media/tracks/"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: "--force-with-lease"

      - name: Fail job if scrape step failed
        if: steps.scrape.outcome == 'failure'
        run: exit 1

      # Covers a genuine script failure() as well as cancelled(). is_retry
      # guards against looping: a run dispatched BY this step carries
      # is_retry=true, so a second failure falls through to "Report failure"
      # instead of dispatching again.
      - name: Retry once on failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scrape-circuit-images.yml/dispatches" \
            -d '{"ref":"main","inputs":{"is_retry":"true"}}' || echo "Retry dispatch failed (non-fatal)"

      # Only reached once the automated retry above has ALSO failed/been
      # cancelled - a single transient blip no longer emails anyone.
      - name: Report failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry == 'true'
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "x-scraper-secret: ${SCRAPER_SECRET}" \
            -d "{\"workflow\":\"scrape-circuit-images\",\"message\":\"Circuit images scrape failed (auto-retry also failed)\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://us-central1-btcchub-af77a.cloudfunctions.net/reportScraperFailure" || echo "Failure report failed (non-fatal)"
