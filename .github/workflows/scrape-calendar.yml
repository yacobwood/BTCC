# Runs the calendar + session-schedule scrapers on a schedule. Picks up new
# calendar data automatically when btcc.net publishes it. Fetches via
# Scrapfly (see scrape-news.yml's own comment / project_scrapfly_full_migration
# memory) as of 2026-09-01 rather than a self-hosted runner's local Playwright -
# runs on GitHub-hosted ubuntu-latest, no residential IP needed.
#
# Weekly, not daily: per btcc.net's own dev, "calendar doesn't get updated
# often, once set at season launch kinda stays that way most of the time" -
# and race results/standings only move on race weekends, so a Monday check
# reliably catches anything from the weekend just gone. Scrape_schedule.py
# runs right after this as a pure local transform of the fullTimetable this
# step just wrote to calendar.json - it used to independently re-fetch the
# same ~10 circuit pages a second time on its own schedule, doubling load on
# btcc.net for no reason.
name: Scrape BTCC Calendar

on:
  schedule:
    # Weekly, Monday 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year (e.g. 2026)"
        type: number
        default: 2026
      is_retry:
        description: "internal - marks this run as an automated retry (do not set manually)"
        type: boolean
        default: false

concurrency:
  group: scrape-calendar
  # false, not true: unlike scrape-news.yml (every 5 minutes, where a stale
  # run should always lose to a fresher one), this only runs weekly - a
  # manual workflow_dispatch overlapping the Monday cron should queue behind
  # whichever started first, not cancel it outright. Matches
  # scrape-btcc-stats.yml/scrape-team-stats.yml's own concurrency setting.
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Scrape calendar
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
        working-directory: tools/scraper
        run: |
          SEASON="${{ github.event.inputs.season }}"
          [ -z "$SEASON" ] && SEASON=2026
          python3 scrape_calendar.py --season "$SEASON"

      - name: Derive session schedule (no network - reuses calendar.json's fullTimetable)
        working-directory: tools/scraper
        run: python3 scrape_schedule.py

      - name: Merge sessions into app calendar
        working-directory: tools/scraper
        run: python3 merge_schedule.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update calendar and schedule from btcc.net [skip ci]"
          file_pattern: "data/calendar.json data/schedule.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      # Covers a genuine script failure() as well as cancelled(). This only
      # runs weekly, so a failure here would otherwise wait a full week for
      # its next natural attempt. Carries season through so a manual
      # historical-backfill retry targets the same year. is_retry guards
      # against looping: a run dispatched BY this step carries
      # is_retry=true, so a second failure falls through to "Report
      # failure" instead of dispatching again.
      - name: Retry once on failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scrape-calendar.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"is_retry\":\"true\",\"season\":\"${{ github.event.inputs.season || '2026' }}\"}}" || echo "Retry dispatch failed (non-fatal)"

      # Only reached once the automated retry above has ALSO failed/been
      # cancelled - a single transient blip no longer emails anyone.
      - name: Report failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry == 'true'
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "x-scraper-secret: ${SCRAPER_SECRET}" \
            -d "{\"workflow\":\"scrape-calendar\",\"message\":\"Calendar scrape failed (auto-retry also failed)\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://us-central1-btcchub-af77a.cloudfunctions.net/reportScraperFailure" || echo "Failure report failed (non-fatal)"
