name: Race Day Start

# Runs every morning to check if today is a BTCC race day.
# If it is, automatically dispatches the session-watcher workflow.
#
# Cron deliberately fires at :27, not the round :30 mark - GitHub's own
# docs (confirmed live 2026-09-02, see scrape-news.yml's own comment/
# project_overnight_cron_gap_fix memory) warn that scheduled triggers can
# be delayed or dropped under load, worst at round minute marks. This is a
# once-per-weekend-morning trigger feeding session-watcher.yml, which
# needs to be connected before the earliest session of the day (as little
# as 45 min later on some rounds) - a delay here is more consequential
# than on scrape-news.yml's own frequent polling, where a missed tick is
# just briefly stale data.

on:
  schedule:
    - cron: "27 8 * * 6,0"   # 08:27 UTC, Saturdays and Sundays only
  workflow_dispatch:           # allow manual trigger for testing

jobs:
  check-and-start:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check schedule and dispatch session watcher
        run: python .github/scripts/start_race_day.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
