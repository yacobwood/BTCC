# Every scraper that has to render btcc.net through real JS (news, articles,
# calendar, team stats) depends on the single self-hosted "btcc-mac" runner -
# see scrape-news.yml's comment for why a GitHub-hosted runner can't do this
# job. None of those workflows can ever detect a fully offline runner: their
# failure alert only fires from an `if: failure()` step, which requires a job
# to have actually started. A runner that's simply unreachable never starts
# one, so an outage was previously silent. This workflow runs on the
# *GitHub-hosted* pool specifically so it keeps working even when btcc-mac
# is the thing that's down.
#
# Originally checked GET /actions/runners directly, but that endpoint needs
# "Administration" repo access, which the automatic GITHUB_TOKEN can never
# be granted regardless of the `permissions:` block below - only a real PAT
# has that scope. Checking scrape-news.yml's own run history instead (needs
# only the standard `actions: read` GITHUB_TOKEN already has) is arguably a
# better signal anyway: it also catches a run stuck queued forever because
# no runner ever picked it up, not just a runner reporting itself offline.
name: Runner Heartbeat

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:

permissions:
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check scrape-news run recency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          response=$(curl -s -w '\n%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scrape-news.yml/runs?per_page=3")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" != "200" ]; then
            message="Could not check scrape-news run history (GitHub API returned HTTP ${http_code})"
          elif [ "$(echo "$body" | jq -r '.total_count')" = "0" ]; then
            message="scrape-news.yml has no recorded runs at all"
          else
            created_at=$(echo "$body" | jq -r '.workflow_runs[0].created_at')
            created_epoch=$(date -d "$created_at" +%s)
            now_epoch=$(date -u +%s)
            age_min=$(( (now_epoch - created_epoch) / 60 ))
            # cron is every 5 minutes - 20 minutes of no new run being
            # *created* at all means GitHub's own scheduler has stopped
            # triggering it (rare - not the runner's fault).
            if [ "$age_min" -gt 20 ]; then
              message="Most recent scrape-news run started ${age_min} minutes ago (expected every 5) - btcc-mac may be offline or not picking up jobs"
            else
              # A fresh run existing isn't proof the runner is healthy: cron
              # creates a new run every 5 minutes purely on GitHub's side
              # regardless of whether btcc-mac ever dequeues it. 2026-08-19:
              # btcc-mac slept for ~5 hours overnight (laptop dropped onto
              # battery power, macOS suspended its listener mid-poll); 7
              # runs in a row sat queued and were cancelled by the next
              # tick's cancel-in-progress before ever starting, and this
              # check stayed "healthy" the entire time because a run kept
              # getting *created* on schedule. Check whether the run
              # actually reached a runner instead.
              run_id=$(echo "$body" | jq -r '.workflow_runs[0].id')
              jobs=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/${run_id}/jobs")
              started_at=$(echo "$jobs" | jq -r '.jobs[0].started_at // empty')
              conclusions=$(echo "$body" | jq -r '[.workflow_runs[0:3][].conclusion] | join(",")')

              if [ -z "$started_at" ] && [ "$age_min" -ge 8 ]; then
                message="Most recent scrape-news run (id ${run_id}) has been queued for ${age_min} minutes without starting - btcc-mac isn't picking up jobs"
              elif [ "$conclusions" = "cancelled,cancelled,cancelled" ]; then
                message="Last 3 scrape-news runs were all cancelled before starting - btcc-mac may be offline or not picking up jobs"
              else
                echo "scrape-news last started ${age_min} minute(s) ago - healthy."
                exit 0
              fi
            fi
          fi

          echo "$message"
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "x-scraper-secret: ${SCRAPER_SECRET}" \
            -d "{\"workflow\":\"runner-heartbeat\",\"message\":\"${message}\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://us-central1-btcchub-af77a.cloudfunctions.net/reportScraperFailure" || echo "Failure report failed (non-fatal)"
