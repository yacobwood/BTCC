# Runs the news scrapers on a schedule so both the sendSessionNotifications
# Cloud Function and the app itself can read btcc.net content from GitHub
# instead of hitting btcc.net directly at runtime. btcc.net moved off
# WordPress to a Vercel-hosted React app (2026-07-31) and now issues a JS
# proof-of-work challenge (HTTP 429) to any request that can't execute
# JavaScript - AND the challenge also factors in network/IP reputation, so
# even headless Chromium still gets blocked from GitHub-hosted runners.
# This runs on a self-hosted runner (the user's own Mac, label "btcc-mac")
# instead, whose residential/office IP clears the challenge. Interim fix
# until btcc.net's dev allowlists our traffic - see project_vercel_migration
# memory. Uses a persistent venv at ~/.btcc-scraper-venv (with Playwright's
# Chromium already downloaded) instead of reinstalling every 5 minutes.
name: Scrape BTCC News

on:
  schedule:
    # Every 5 minutes - keeps notification lag close to the previous
    # live-check behaviour.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-news
  # true, not false: this runs every 5 minutes on a single self-hosted
  # runner shared with every other btcc.net-facing scraper, so a slow or
  # stuck run must not let queued-up ticks pile up behind it - cancel the
  # stale one and let the freshest tick through instead.
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: [self-hosted, btcc-mac]
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Scrape news
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: ~/.btcc-scraper-venv/bin/python tools/scraper/scrape_news.py

      # Committed immediately, before the much slower article-mirror step
      # below - sendSessionNotifications (every 1 min) can only react to
      # whatever data/news.json currently says, so this fast,
      # notification-critical update must never be held hostage by (or
      # discarded along with) the per-article Playwright fetches that
      # follow. Root cause of a real incident (2026-08-09, see
      # project_notification_delay_fix memory): on a race weekend several
      # articles publish in quick succession, so "Scrape full article
      # mirror" can need multiple never-before-cached Playwright fetches
      # and run past 5 minutes - cancel-in-progress then killed the whole
      # job before it ever reached the old single end-of-job commit,
      # discarding this step's already-successful output right along with
      # it. Repeated every 5 minutes for ~5 hours with nothing landing at
      # all, so notifications for genuinely new articles sat hours-stale.
      - name: Commit news update
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update news.json from btcc.net [skip ci]"
          file_pattern: "data/news.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: "--force-with-lease"

      - name: Scrape full article mirror
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: ~/.btcc-scraper-venv/bin/python tools/scraper/scrape_articles.py

      # Re-sync first - real time may have passed inside the article-mirror
      # step above (it's the slow one), and other workflows (e.g. live
      # results, every 2 minutes on a race weekend) push to main constantly.
      # --autostash is required here (unlike the earlier "Pull latest" step):
      # scrape_articles.py has already written local, uncommitted changes by
      # this point, and a plain rebase refuses to run against a dirty working
      # tree ("cannot pull with rebase: you have unstaged changes" - broke
      # run #486 the first time this shipped without it). Autostash shelves
      # those changes for the rebase and restores them straight after.
      - name: Pull latest before article commit
        run: git pull --rebase --autostash origin main

      - name: Commit article mirror
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update article mirror from btcc.net [skip ci]"
          file_pattern: "data/articles.json data/articles/ data/media/news/"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: "--force-with-lease"

      - name: Report failure
        if: failure()
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "x-scraper-secret: ${SCRAPER_SECRET}" \
            -d "{\"workflow\":\"scrape-news\",\"message\":\"News scrape failed\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://us-central1-btcchub-af77a.cloudfunctions.net/reportScraperFailure" || echo "Failure report failed (non-fatal)"
