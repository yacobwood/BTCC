# Runs the news scrapers on a schedule so both the sendSessionNotifications
# Cloud Function and the app itself can read btcc.net content from GitHub
# instead of hitting btcc.net directly at runtime. btcc.net moved off
# WordPress to a Vercel-hosted React app (2026-07-31) and now issues a JS
# proof-of-work challenge (HTTP 429) to any request that can't execute
# JavaScript - AND the challenge also factors in network/IP reputation, so
# even headless Chromium still gets blocked from GitHub-hosted runners.
# This runs on a self-hosted runner (the user's own Mac, label "btcc-mac")
# instead, whose residential/office IP clears the challenge. Interim fix
# until btcc.net's dev allowlists our traffic - see project_vercel_migration
# memory. Uses a persistent venv at ~/.btcc-scraper-venv (with Playwright's
# Chromium already downloaded) instead of reinstalling every 5 minutes.
name: Scrape BTCC News

on:
  schedule:
    # Every 5 minutes - keeps notification lag close to the previous
    # live-check behaviour.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-news
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: [self-hosted, btcc-mac]
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Scrape news
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: ~/.btcc-scraper-venv/bin/python tools/scraper/scrape_news.py

      - name: Scrape full article mirror
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: ~/.btcc-scraper-venv/bin/python tools/scraper/scrape_articles.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update news from btcc.net [skip ci]"
          file_pattern: "data/news.json data/articles.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: "--force-with-lease"

      - name: Report failure
        if: failure()
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "x-scraper-secret: ${SCRAPER_SECRET}" \
            -d "{\"workflow\":\"scrape-news\",\"message\":\"News scrape failed\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://us-central1-btcchub-af77a.cloudfunctions.net/reportScraperFailure" || echo "Failure report failed (non-fatal)"
