# Runs the news scrapers on a schedule so both the sendSessionNotifications
# Cloud Function and the app itself can read btcc.net content from GitHub
# instead of hitting btcc.net directly at runtime.
#
# Migrated off the self-hosted btcc-mac runner to GitHub-hosted ubuntu-latest
# on 2026-09-01 (see project_scrapfly_full_migration memory) - btcc.net's
# Vercel BotID JS challenge used to require a residential-IP headless
# browser (Playwright, via btcc_playwright.py) to clear, which meant every
# btcc.net-facing workflow had to share one single self-hosted runner. That
# runner became a real reliability problem: this cron was landing successful
# runs every 4-5 hours instead of every 5 minutes, root-caused to runner
# contention from other scheduled workflows (see git history / README §20's
# "Shared self-hosted runner contention"). Scrapfly's paid Scrape API
# (asp=true, see scrapfly_fallback.py) clears the same challenge from any
# IP, confirmed live, so this now runs on elastic GitHub-hosted infrastructure
# with no shared-runner bottleneck at all.
#
# Schedule is deliberately NOT flat 5-minute-forever: Scrapfly bills per
# request, and full-time 5-minute polling was estimated at 190k-268k
# credits/month depending on article volume - past the $30/mo Discovery
# tier's 200k ceiling. 07:00-20:00 UTC covers UK working hours (BST or GMT)
# at full 5-minute responsiveness - real article-publish activity is
# essentially always in this window - and steps down to hourly the rest of
# the day, since an article published at say 04:01 UTC is still caught
# within the hour (by 05:00), not held until 07:00. Sized against the real
# worst month on record (June 2026, 53 articles) at ~83-88% of the 200k
# ceiling - comfortable margin, not razor's-edge.
#
# The self-hosted Playwright path (btcc_playwright.py, RenderedFetcher) is
# deliberately left completely intact and untouched in the repo - dormant,
# not deleted, in case Scrapfly ever needs to be swapped back out.
#
# Native `schedule:` trigger removed 2026-09-26: this workflow's own real run
# history (checked via the Actions API) showed the schedule trigger simply
# doesn't deliver its own cadence, at all - even on an ordinary day with no
# other Actions load (2026-09-25), only 5 of the ~155 ticks its own two cron
# lines used to produce actually landed. On a live race day
# (2026-09-26, Silverstone), with functions/resultsDispatch.js's Cloud
# Scheduler-driven triggerResultsScrape dispatching scrape-results.yml every
# ~2 minutes for live coverage, only 3 landed all day - the user had to
# manually re-dispatch this workflow repeatedly just to get a published
# btcc.net article showing up in the app. Same root cause, same fix already
# applied to scrape-results.yml on 2026-09-05: GitHub's own `schedule:`
# trigger is best-effort and gets silently dropped under load rather than
# queued or retried, and this repo's own Actions traffic is enough to
# trigger it even without a live race day. functions/newsDispatch.js's
# triggerNewsScrapeBusy/triggerNewsScrapeOvernight now drive this exact same
# cadence via Cloud Scheduler instead (no 5-minute floor, immune to GitHub's
# own queue contention), calling this same workflow_dispatch endpoint - the
# two cron lines that used to live here are reproduced as the two Cloud
# Scheduler jobs' own `schedule` options instead, so cadence/cost is
# unchanged, only the trigger mechanism. See project_scrape_schedule /
# project_scrape_news_schedule_starved_race_day memory for the fuller
# writeup, and README §12/§20 if this ever needs revisiting.
name: Scrape BTCC News

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-fetch the headline's image even if the slug already matches what's committed (for a manual retry after btcc.net adds/changes an image for the current headline - the routine run only checks the image on a slug change)"
        type: boolean
        default: false
      is_retry:
        description: "internal - marks this run as an automated retry (do not set manually)"
        type: boolean
        default: false

concurrency:
  group: scrape-news
  # true, not false: a stale run should always lose to a fresher one at this
  # cadence, same reasoning as before the migration.
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Pull latest
        run: git pull --rebase origin main

      # Only real dependency of the active (Scrapfly) fetch path -
      # scrape_news.py/scrape_articles.py import media_utils.py for image
      # downscaling, which needs Pillow but deliberately not Playwright
      # (see media_utils.py's own module docstring - importing
      # btcc_playwright.py directly for these same helpers used to pull in
      # Playwright too, which isn't installed here and doesn't need to be).
      - name: Install dependencies
        run: pip install --quiet Pillow

      - name: Scrape news
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
        working-directory: tools/scraper
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          python3 scrape_news.py $ARGS

      # Committed immediately, before the slower article-mirror step below -
      # sendSessionNotifications can only react to whatever data/news.json
      # currently says, so this fast, notification-critical update must
      # never be held hostage by the full article mirror that follows.
      - name: Commit news update
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update news.json from btcc.net [skip ci]"
          file_pattern: "data/news.json data/media/news/"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: "--force-with-lease"

      - name: Scrape full article mirror
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
        working-directory: tools/scraper
        run: python3 scrape_articles.py

      - name: Pull latest before article commit
        run: git pull --rebase --autostash origin main

      - name: Commit article mirror
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update article mirror from btcc.net [skip ci]"
          file_pattern: "data/articles.json data/articles/ data/media/news/"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: "--force-with-lease"

      # Covers both a genuine script failure() and a cancelled() run. A
      # single blip self-heals on the next scheduled tick regardless, so
      # only alert once a retry has ALSO failed - see README §20's "Failure
      # handling convention".
      - name: Retry once on failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scrape-news.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"is_retry\":\"true\",\"force\":\"${{ github.event.inputs.force || 'false' }}\"}}" || echo "Retry dispatch failed (non-fatal)"

      - name: Report failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry == 'true'
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "x-scraper-secret: ${SCRAPER_SECRET}" \
            -d "{\"workflow\":\"scrape-news\",\"message\":\"News scrape failed (auto-retry also failed)\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://us-central1-btcchub-af77a.cloudfunctions.net/reportScraperFailure" || echo "Failure report failed (non-fatal)"
