name: Scrape BTCC Results

on:
  schedule:
    # Every 2 min Sat/Sun 09:00–19:00 UTC — is_race_weekend.py gates execution
    # to per-session windows (session BST+15min → session BST+90min), skipping
    # sessions whose results are already committed. Stops as soon as each
    # session's data lands. Latest possible close: 19:00 UTC (R3 17:30 BST+90min).
    - cron: "*/2 9-19 * * 6"
    - cron: "*/2 9-19 * * 0"
  workflow_dispatch:
    inputs:
      year:
        description: "Season year to scrape (e.g. 2026)"
        type: number
        default: 2026
      round:
        description: "Specific round to scrape (leave blank for all)"
        type: number
      override_reverse_grid_draw:
        description: "Manually set Race 3 reverse-grid draw number (6-12) for the specified round. Use when TSL amended the grid PDF after the scrape window closed."
        type: number
      is_retry:
        description: "internal - marks this run as an automated retry (do not set manually)"
        type: boolean
        default: false

concurrency:
  group: scrape-results
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Check race weekend
        id: raceday
        run: python .github/scripts/is_race_weekend.py

      - name: Pull latest before scraping
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.raceday.outputs.in_session_window == 'true'
        run: git pull --rebase origin main

      - name: Set up Python
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.raceday.outputs.in_session_window == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.raceday.outputs.in_session_window == 'true'
        run: pip install pdfminer.six

      - name: Scrape results and compute standings
        id: scrape
        continue-on-error: true
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.raceday.outputs.in_session_window == 'true'
        run: |
          YEAR="${{ github.event.inputs.year }}"
          [ -z "$YEAR" ] && YEAR=2026
          ROUND="${{ github.event.inputs.round }}"
          DRAW="${{ github.event.inputs.override_reverse_grid_draw }}"
          ARGS="$YEAR"
          if [ -n "$ROUND" ]; then
            ARGS="$ARGS --round $ROUND"
          else
            ARGS="$ARGS --today"
          fi
          if [ -n "$DRAW" ]; then
            ARGS="$ARGS --set-draw $DRAW"
          fi
          python tools/scraper/scrape_tsl.py $ARGS

      - name: Pull latest before committing
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.raceday.outputs.in_session_window == 'true'
        run: git pull --rebase --autostash origin main

      - name: Commit updated data
        id: commit
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.raceday.outputs.in_session_window == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update ${{ github.event.inputs.year || '2026' }} results [skip ci]"
          # records.json is deliberately excluded here even though scrape_tsl.py
          # calls compute_records.py on every tick: that recompute undercounts
          # wins/championships for any driver whose career spans pre-2004 (no
          # season JSON exists to see those), relying on scrape_btcc_stats.py's
          # separate daily run to patch the correct official totals back in
          # afterward. Committing the raw per-tick output would ship wrong
          # legendary-driver stats (confirmed: a test run dropped Jason Plato's
          # wins from 97 to 83) until the next daily override run corrected it.
          file_pattern: "data/results*.json data/standings.json data/calendar.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: "--force-with-lease"

      - name: Notify app clients to refresh results cache
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
          YEAR: ${{ github.event.inputs.year || '2026' }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "x-scraper-secret: ${SCRAPER_SECRET}" \
            -d "{\"year\":\"${YEAR}\"}" \
            "https://us-central1-btcchub-af77a.cloudfunctions.net/notifyResultsUpdate" || echo "Notify failed (non-fatal)"

      # scrape_tsl.py already writes results/standings before compute_records or
      # team-stats can fail, so the commit step above still runs and saves the
      # good data even when the scrape step below reports failure. This step
      # makes sure that failure is still reported and the job/run itself
      # shows red, instead of the whole thing silently looking green.
      - name: Fail job if scrape step failed
        if: steps.scrape.outcome == 'failure'
        run: exit 1

      # Added 2026-09-05: the commit step above can fail on a genuine, ordinary
      # race - triggerResultsScrape (functions/resultsDispatch.js) now dispatches
      # this workflow reliably every 2 minutes on a raceday, and stefanzweifel/
      # git-auto-commit-action's push_options: --force-with-lease rejects with
      # "stale info" if any other push (this workflow's own next tick, a
      # different scraper, a hub-news/digest publish, ...) lands on main in the
      # few seconds between this run's rebase and its push - confirmed live,
      # the first real failure this surfaced. Not a real problem: a fresh
      # `git pull --rebase` on the very next attempt resolves it cleanly. Same
      # auto-retry-before-alerting pattern the 5 btcc.net-facing workflows
      # already use (scrape-news.yml etc.) - re-dispatches this same workflow
      # once, carrying forward whatever manual inputs this run had, before ever
      # alerting. Whole-job `failure()`, not scoped to one step, so it also
      # catches the commit step's own failure alongside the scrape step's.
      - name: Retry once on failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scrape-results.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"is_retry\":\"true\",\"year\":\"${{ github.event.inputs.year || '2026' }}\",\"round\":\"${{ github.event.inputs.round }}\",\"override_reverse_grid_draw\":\"${{ github.event.inputs.override_reverse_grid_draw }}\"}}" || echo "Retry dispatch failed (non-fatal)"

      - name: Report failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry == 'true'
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "x-scraper-secret: ${SCRAPER_SECRET}" \
            -d "{\"workflow\":\"scrape-results\",\"message\":\"Results scrape failed (auto-retry also failed) - results/standings were still committed if produced - see run log\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://us-central1-btcchub-af77a.cloudfunctions.net/reportScraperFailure" || echo "Failure report failed (non-fatal)"
