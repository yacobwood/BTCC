name: Scrape ITV YouTube Race Links

on:
  schedule:
    - cron: "0 10 * * 1"   # Monday 10:00 UTC
    - cron: "0 10 * * 2"   # Tuesday 10:00 UTC (catches late uploads)
  workflow_dispatch:
    inputs:
      is_retry:
        description: "internal - marks this run as an automated retry (do not set manually)"
        type: boolean
        default: false

# workflow_dispatch is explicitly invited here for a manual "catch late
# uploads" re-run, which can genuinely overlap with the Monday/Tuesday
# scheduled runs and write the same data files - queue behind whichever
# started first rather than let them race, same reasoning as
# scrape-calendar.yml/scrape-team-stats.yml's own cancel-in-progress: false.
concurrency:
  group: scrape-youtube
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yt-dlp Pillow numpy

      - name: Write YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: printf '%s' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt

      - name: Scrape YouTube race links
        env:
          YT_COOKIES_FILE: /tmp/yt_cookies.txt
        run: python tools/scraper/scrape_youtube.py

      - name: Commit updated results
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update race YouTube links [skip ci]"
          file_pattern: "data/results2026.json data/calendar.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: "--force-with-lease"

      # Covers a genuine script failure() as well as cancelled(). This only
      # runs weekly, so a failure here would otherwise wait a full week for
      # its next natural attempt. is_retry guards against looping: a run
      # dispatched BY this step carries is_retry=true, so a second failure
      # falls through to "Report failure" instead of dispatching again.
      - name: Retry once on failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scrape-youtube.yml/dispatches" \
            -d '{"ref":"main","inputs":{"is_retry":"true"}}' || echo "Retry dispatch failed (non-fatal)"

      # Only reached once the automated retry above has ALSO failed/been
      # cancelled - a single transient blip no longer emails anyone.
      - name: Report failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry == 'true'
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "x-scraper-secret: ${SCRAPER_SECRET}" \
            -d "{\"workflow\":\"scrape-youtube\",\"message\":\"YouTube race link scrape failed (auto-retry also failed)\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://us-central1-btcchub-af77a.cloudfunctions.net/reportScraperFailure" || echo "Failure report failed (non-fatal)"
