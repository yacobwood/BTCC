# Runs the gallery scraper on a schedule. Fetches via Scrapfly (see
# scrape-news.yml's own comment / project_scrapfly_full_migration memory)
# as of 2026-09-01 rather than a self-hosted runner's local Playwright -
# runs on GitHub-hosted ubuntu-latest, no residential IP needed and no
# runner-time contention with the other scrapers to worry about any more.
#
# Weekly, on Wednesday rather than Monday - still deliberately spread off
# the scrape-btcc-stats/scrape-team-stats/scrape-calendar chain, mostly to
# keep commit conflicts on data/calendar.json's own consumers apart rather
# than for runner-contention reasons now. This scraper hotlinks photos
# directly (no image bytes captured/resized - see scrape_gallery.py's own
# module docstring) but can still visit many paginated pages in one run (a
# single album can span 8+ pages).
#
# scrape_gallery.py is deliberately incremental/resumable by PAGE, not by
# photo (see its own module docstring): a routine run only visits whatever
# pages are new or still unscraped since the last run, so a normal week's
# run is cheap even though the very first run for a season backfills
# everything that already exists. Historical seasons (2010-2025) are NOT
# backfilled by this schedule at all - run workflow_dispatch manually with
# an older `season` input whenever there's spare capacity, so this weekly
# job stays focused on the current season.
name: Scrape BTCC Gallery

on:
  schedule:
    # Weekly, Wednesday 09:00 UTC.
    - cron: "0 9 * * 3"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year (e.g. 2026) - use an older year for a manual historical backfill"
        type: number
        default: 2026
      is_retry:
        description: "internal - marks this run as an automated retry (do not set manually)"
        type: boolean
        default: false

concurrency:
  group: scrape-gallery
  # false: a manual workflow_dispatch (e.g. right after a race weekend, or a
  # historical backfill) should queue behind an in-flight run rather than
  # cancel it outright - matches scrape-calendar.yml/scrape-team-stats.yml's
  # own setting, for the same reason (this runs at most weekly, not on
  # scrape-news.yml's 5-minute cadence where a stale run should always lose).
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Scrape gallery
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
        working-directory: tools/scraper
        run: |
          SEASON="${{ github.event.inputs.season }}"
          [ -z "$SEASON" ] && SEASON=2026
          python3 scrape_gallery.py --season "$SEASON"

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update gallery from btcc.net [skip ci]"
          # No data/media/gallery/ - this scraper hotlinks photos directly
          # (confirmed live: gallery images are public Supabase Storage
          # URLs on a different host than btcc.net, unaffected by its
          # Vercel bot-challenge) rather than mirroring image bytes.
          file_pattern: "data/gallery*.json data/gallery/"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      # Covers a genuine script failure() as well as cancelled(). This only
      # runs weekly, so a failure here would otherwise wait a full week for
      # its next natural attempt. Carries season through so a manual
      # historical-backfill retry targets the same year; scrape_gallery.py
      # is resumable by page (see its own module docstring) so a retry
      # cheaply picks up from whatever already committed rather than
      # re-scraping from scratch. is_retry guards against looping: a run
      # dispatched BY this step carries is_retry=true, so a second failure
      # falls through to "Report failure" instead of dispatching again.
      - name: Retry once on failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scrape-gallery.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"is_retry\":\"true\",\"season\":\"${{ github.event.inputs.season || '2026' }}\"}}" || echo "Retry dispatch failed (non-fatal)"

      # Only reached once the automated retry above has ALSO failed/been
      # cancelled - a single transient blip no longer emails anyone.
      - name: Report failure
        if: (failure() || cancelled()) && github.event.inputs.is_retry == 'true'
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "x-scraper-secret: ${SCRAPER_SECRET}" \
            -d "{\"workflow\":\"scrape-gallery\",\"message\":\"Gallery scrape failed (auto-retry also failed)\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://us-central1-btcchub-af77a.cloudfunctions.net/reportScraperFailure" || echo "Failure report failed (non-fatal)"
